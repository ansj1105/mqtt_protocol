version: '3.8'

services:
  websocket-server:
    build: .
    container_name: websocket-server
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - LOG_LEVEL=INFO
      - TLS_ENABLED=true
      - PQC_ENABLED=true
    networks:
      - websocket-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  websocket-network:
    driver: bridge

