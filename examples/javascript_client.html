<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Client Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .log {
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            max-height: 400px;
            overflow-y: auto;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
        }
        .sent {
            color: blue;
        }
        .received {
            color: green;
        }
        .error {
            color: red;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        input {
            padding: 8px;
            width: 300px;
        }
    </style>
</head>
<body>
    <h1>WebSocket 클라이언트 예제</h1>
    
    <div>
        <button onclick="connect()">연결</button>
        <button onclick="disconnect()">연결 해제</button>
        <button onclick="sendPing()">Ping 전송</button>
        <button onclick="sendTC375Data()">TC375 데이터 전송</button>
    </div>
    
    <div style="margin: 20px 0;">
        <input type="text" id="messageInput" placeholder="메시지 입력">
        <button onclick="sendCustomMessage()">전송</button>
    </div>
    
    <div class="log" id="log"></div>

    <script>
        let ws = null;

        function log(message, className = '') {
            const logDiv = document.getElementById('log');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(msgDiv);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function connect() {
            // WebSocket 연결
            ws = new WebSocket('wss://54.234.98.110:8765/ws');
            
            ws.onopen = () => {
                log('✅ 연결됨!', 'received');
            };
            
            ws.onmessage = (event) => {
                log(`📨 수신: ${event.data}`, 'received');
                
                try {
                    const data = JSON.parse(event.data);
                    
                    // Welcome 메시지 처리
                    if (data.type === 'welcome') {
                        log(`클라이언트 ID: ${data.payload.client_id}`, 'received');
                        log(`PQC 활성화: ${data.payload.pqc_enabled}`, 'received');
                    }
                    
                    // Pong 메시지 처리
                    if (data.type === 'pong') {
                        log('💓 Pong 수신', 'received');
                    }
                } catch (e) {
                    // JSON 파싱 실패 시 무시
                }
            };
            
            ws.onerror = (error) => {
                log(`❌ 에러: ${error}`, 'error');
            };
            
            ws.onclose = () => {
                log('❌ 연결 종료', 'error');
                ws = null;
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                log('연결 해제 요청', 'sent');
            }
        }

        function sendPing() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ 연결되지 않음', 'error');
                return;
            }
            
            const msg = {
                type: 'ping',
                payload: {
                    timestamp: new Date().toISOString()
                }
            };
            
            ws.send(JSON.stringify(msg));
            log('📤 Ping 전송', 'sent');
        }

        function sendTC375Data() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ 연결되지 않음', 'error');
                return;
            }
            
            const msg = {
                type: 'tc375_data',
                payload: {
                    protocol: 'v2',
                    payload: {
                        sensor_data: {
                            temperature: 25.5,
                            humidity: 60.2,
                            pressure: 1013.25
                        },
                        timestamp: new Date().toISOString()
                    }
                }
            };
            
            ws.send(JSON.stringify(msg));
            log('📤 TC375 데이터 전송', 'sent');
        }

        function sendCustomMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ 연결되지 않음', 'error');
                return;
            }
            
            const input = document.getElementById('messageInput');
            const msg = {
                type: 'command',
                payload: {
                    command: 'echo',
                    params: {
                        message: input.value
                    }
                }
            };
            
            ws.send(JSON.stringify(msg));
            log(`📤 전송: ${input.value}`, 'sent');
            input.value = '';
        }

        // 엔터키로 메시지 전송
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendCustomMessage();
            }
        });
    </script>
</body>
</html>
